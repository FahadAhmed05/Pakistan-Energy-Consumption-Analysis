# Both themes are defined. Streamlit follows the system setting and the viewer can switch
# in the top-right menu (Settings > Theme). app.py reads the active theme to colour charts and cards.
[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
font = "sans-serif"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
font = "sans-serif"

[server]
headless = true

[browser]
gatherUsageStats = false
